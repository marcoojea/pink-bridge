name: Demo en GitHub Pages

# Publica la demostración de solo lectura: la misma interfaz con datos de ejemplo guardados en el repo
# (apps/web/public/demo). No hay API ni navegador en el servidor, así que no se puede analizar nada.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Compilar la demostración
        run: npm run build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
